[project]
name = "midas-backend"
version = "0.1.0"
description = "MIDAS portfolio backend — services, ADK agents, MCP, and LiteLLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "litellm>=1.84.0",
    "google-adk>=2.4.0",
    "fastmcp>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
midas-mcp = "app.mcp.server:main"
midas-api = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring live LLM credentials",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
