[project]
name = "midas-database"
version = "0.1.0"
description = "MIDAS embedded PostgreSQL — lifecycle, migrations, DBeaver sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pgembed>=0.2.0",
    "pgvector>=0.4.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
midas-db = "midas_db.embedded:main"
midas-dbeaver = "midas_db.dbeaver:sync_dbeaver_connection"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midas_db"]
